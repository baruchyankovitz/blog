apiVersion: apps/v1
kind: Deployment
metadata:
  name: moderation-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: moderation
  template:
    metadata:
      labels:
        app: moderation
    spec:
      containers:
        - name: moderation
          image: baruchyankvitz/moderation:latest
      containers:
        - name: moderation
          image: baruchyankvitz/moderation:latest
          env:
            - name: PORT
              value: "4003"
            - name: EVENT_BUS_URL
              value: "http://event-bus-srv:4005/events"
