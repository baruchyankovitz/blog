apiVersion: apps/v1
kind: Deployment
metadata:
  name: query-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: query
  template:
    metadata:
      labels:
        app: query
    spec:
      containers:
        - name: query
          image: baruchyankvitz/query:latest
          env:
            - name: EVENT_BUS_URL
              value: "http://event-bus-srv:4005/events"
